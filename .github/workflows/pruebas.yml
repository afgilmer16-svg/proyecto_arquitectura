name: Pruebas del generador XML

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Pruebas unitarias, de contrato y de arquitectura, con cobertura minima del 90 %
        run: python -m pytest -v --cov=facturacion_xml --cov-report=term-missing --cov-report=xml

      - name: Pruebas de mutacion (cada error introducido debe ser detectado)
        run: python tests/mutacion.py

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-${{ matrix.python-version }}
          path: coverage.xml
