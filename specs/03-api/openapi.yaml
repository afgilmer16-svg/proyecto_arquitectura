        registros_totales:
          type: "integer"
          example: 5000
        registros_procesados:
          type: "integer"
          example: 4950
        registros_fallidos:
          type: "integer"
          example: 50
        errores:
          type: "array"
          items:
            type: "string"
          example: ["Línea 42: RUC '12345678' inválido según algoritmo Módulo 11."]
        fecha_inicio:
          type: "string"
          format: "date-time"
          example: "2026-10-22T08:00:00Z"
