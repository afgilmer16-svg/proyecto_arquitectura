  /catalogos/{numero}:
    get:
      tags:
        - "Catálogos"
      summary: "Consultar catálogo oficial de SUNAT (Anexo 8)"
      operationId: "consultarCatalogoSunat"
      description: |
        **Caso de Uso**: `CU-13` (Consultar Catálogos SUNAT).
        
        Retorna la lista de valores normativos del catálogo oficial especificado (e.g., Catálogo 01: Tipo comprobante, 05: Tipo de tributo, 07: Tipo de afectación del IGV).
      parameters:
        - name: "numero"
          in: "path"
          required: true
          schema:
            type: "string"
            pattern: "^[0-9]{2}$"
          description: "Número del catálogo en formato de dos dígitos (e.g., '01', '05', '07')"
          example: "07"
      responses:
        "200":
          description: "Valores oficiales del catálogo de SUNAT."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogoSunatResponse"
        "400":
          description: "Formato de número de catálogo inválido."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "El catálogo de SUNAT especificado no existe."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /migraciones/legado:
    post:
      tags:
        - "Migración"
      summary: "Iniciar proceso de migración de datos del sistema legado"
      operationId: "iniciarMigracionLegado"
      description: |
        **Caso de Uso**: `CU-14` (Migrar Datos del Sistema Legado).
        
        Carga y procesa un lote de ventas y productos históricos desde archivos planos o bases de datos heredadas para convertirlos a la estructura del nuevo sistema.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MigracionLegadoRequest"
      responses:
        "201":
          description: "Lote de migración aceptado e iniciado."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigracionResponse"
        "400":
          description: "Formato de archivo o datos de origen corruptos o inválidos."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Existe un proceso de migración activo en ejecución."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "Falla de integridad referencial o discrepancias insalvables en los datos del legado."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /migraciones/{id}:
    get:
      tags:
        - "Migración"
      summary: "Consultar estado y progreso de un lote de migración"
      operationId: "consultarEstadoMigracion"
      description: |
        **Caso de Uso**: `CU-14` (Migrar Datos del Sistema Legado).
        
        Verifica el avance, cantidad de registros procesados con éxito y bitácora de errores del proceso de migración.
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
          description: "UUID del proceso de migración"
      responses:
        "200":
          description: "Estado del proceso de migración."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigracionResponse"
        "404":
          description: "Proceso de migración no encontrado."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    EmitirComprobanteRequest:
      type: "object"
      required:
        - "tipo_comprobante"
        - "serie"
        - "correlativo"
        - "fecha_emision"
        - "moneda"
        - "emisor"
        - "receptor"
        - "items"
        - "totales"
      properties:
        tipo_comprobante:
          $ref: "#/components/schemas/TipoComprobanteEnum"
        serie:
          type: "string"
          pattern: "^[F|B][A-Z0-9]{3}$"
          example: "F001"
        correlativo:
          type: "integer"
          minimum: 1
          maximum: 99999999
          example: 42
        fecha_emision:
          type: "string"
          format: "date"
          example: "2026-10-22"
        hora_emision:
          type: "string"
          pattern: "^(0[0-9]|1[0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$"
          example: "10:30:00"
        moneda:
          type: "string"
          enum: ["PEN", "USD"]
          default: "PEN"
        forma_pago:
          $ref: "#/components/schemas/FormaPago"
        emisor:
          $ref: "#/components/schemas/EmisorFiscal"
        receptor:
          $ref: "#/components/schemas/ClienteReceptorDto"
        items:
          type: "array"
          minItems: 1
          items:
            $ref: "#/components/schemas/ItemComprobanteDto"
        totales:
          $ref: "#/components/schemas/TotalesComprobanteDto"

    ComprobanteResponse:
      type: "object"
      required:
        - "id"
        - "tipo_comprobante"
        - "serie"
        - "correlativo"
        - "fecha_emision"
        - "moneda"
        - "importe_total"
        - "estado"
        - "hash_sha256"
        - "fecha_registro"
      properties:
        id:
          type: "string"
          format: "uuid"
          example: "a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11"
        tipo_comprobante:
          $ref: "#/components/schemas/TipoComprobanteEnum"
        serie:
          type: "string"
          example: "F001"
        correlativo:
          type: "integer"
          example: 42
        fecha_emision:
          type: "string"
          format: "date"
          example: "2026-10-22"
        moneda:
          type: "string"
          example: "PEN"
        importe_total:
          type: "number"
          format: "double"
          example: 2127.18
        estado:
          $ref: "#/components/schemas/EstadoComprobanteEnum"
        hash_sha256:
          type: "string"
          example: "4v8K+qK20yD...SHA256HASH=="
          description: "Digest criptográfico de la firma digital XMLDSig"
        cdr:
          $ref: "#/components/schemas/CdrDto"
        enlaces:
          type: "object"
          properties:
            xml:
              type: "string"
              example: "/v1/comprobantes/a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11/xml"
            pdf:
              type: "string"
              example: "/v1/comprobantes/a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11/pdf"
            cdr:
              type: "string"
              example: "/v1/comprobantes/a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11/cdr"
        fecha_registro:
          type: "string"
          format: "date-time"
          example: "2026-10-22T10:30:15Z"

    ComprobanteListResponse:
      type: "object"
      required:
        - "data"
        - "page"
        - "page_size"
        - "total_records"
        - "total_pages"
      properties:
        data:
          type: "array"
          items:
            $ref: "#/components/schemas/ComprobanteResponse"
        page:
          type: "integer"
          example: 1
        page_size:
          type: "integer"
          example: 20
        total_records:
          type: "integer"
          example: 142
        total_pages:
          type: "integer"
          example: 8

    EmisorFiscal:
      type: "object"
      required:
        - "ruc"
        - "razon_social"
        - "direccion"
        - "ubigeo"
      properties:
        ruc:
          type: "string"
          pattern: "^[0-9]{11}$"
          example: "20601234567"
        razon_social:
          type: "string"
          example: "ABC SOFTWARE CORP S.A.C."
        nombre_comercial:
          type: "string"
          example: "DISTRIBUIDORA DE ABARROTES ABC"
        direccion:
          type: "string"
          example: "Av. Universitaria 123, Tingo María, Huánuco"
        ubigeo:
          type: "string"
          pattern: "^[0-9]{6}$"
          example: "100601"

    ClienteReceptorDto:
      type: "object"
      required:
        - "tipo_documento"
        - "numero_documento"
        - "razon_social"
      properties:
        tipo_documento:
          type: "string"
          enum: ["6", "1", "4", "7", "0"]
          description: "Catálogo 06 SUNAT: '6' RUC, '1' DNI, '4' Carné Extranjería, '0' Sin Documento"
          example: "6"
        numero_documento:
          type: "string"
          example: "20555555551"
        razon_social:
          type: "string"
          example: "COMERCIALIZADORA SAN JUAN S.A.C."
        direccion:
          type: "string"
          example: "Jr. Comercio 456, Rupa Rupa, Leoncio Prado"
        email:
          type: "string"
          format: "email"
          example: "facturacion@sanjuan.pe"

    ItemComprobanteDto:
      type: "object"
      required:
        - "numero_linea"
        - "codigo_producto"
        - "descripcion"
        - "unidad_medida"
        - "cantidad"
        - "valor_unitario"
        - "precio_unitario"
        - "tipo_afectacion_igv"
        - "monto_igv"
        - "valor_total"
      properties:
        numero_linea:
          type: "integer"
          minimum: 1
          example: 1
        codigo_producto:
          type: "string"
          example: "PROD-ARR-01"
        descripcion:
          type: "string"
          example: "Arroz Extra Costeño Saco 50 kg"
        unidad_medida:
          type: "string"
          example: "NIU"
          description: "Código de unidad de medida del Catálogo N° 03 (e.g. NIU para unidad, BX para caja, KGM para kilo)"
        cantidad:
          type: "number"
          format: "double"
          minimum: 0.001
          example: 10
        valor_unitario:
          type: "number"
          format: "double"
          description: "Valor unitario sin impuestos"
          example: 140.00
        precio_unitario:
          type: "number"
          format: "double"
          description: "Precio unitario con impuestos incluidos"
          example: 165.20
        tipo_afectacion_igv:
          type: "string"
          description: "Código del Catálogo N° 07 (e.g. '10' Gravado, '20' Exonerado, '30' Inafecto)"
          example: "10"
        porcentaje_igv:
          type: "number"
          format: "double"
          default: 18.00
          example: 18.00
        monto_igv:
          type: "number"
          format: "double"
          example: 252.00
        monto_icbper:
          type: "number"
          format: "double"
          default: 0.00
          description: "Impuesto a las bolsas plásticas (S/ 0.20 por unidad suministrada)"
          example: 0.00
        valor_total:
          type: "number"
          format: "double"
          description: "Valor de venta total de la línea (cantidad * valor_unitario)"
          example: 1400.00

    TotalesComprobanteDto:
      type: "object"
      required:
        - "total_operaciones_gravadas"
        - "total_igv"
        - "total_impuestos"
        - "importe_total"
      properties:
        total_operaciones_gravadas:
          type: "number"
          format: "double"
          example: 1801.00
        total_operaciones_inafectas:
          type: "number"
          format: "double"
          default: 0.00
          example: 0.00
        total_operaciones_exoneradas:
          type: "number"
          format: "double"
          default: 0.00
          example: 0.00
        total_igv:
          type: "number"
          format: "double"
          example: 324.18
        total_isc:
          type: "number"
          format: "double"
          default: 0.00
          example: 0.00
        total_icbper:
          type: "number"
          format: "double"
          default: 0.00
          example: 2.00
        total_impuestos:
          type: "number"
          format: "double"
          example: 326.18
        importe_total:
          type: "number"
          format: "double"
          example: 2127.18

    FormaPago:
      type: "object"
      required:
        - "tipo"
      properties:
        tipo:
          type: "string"
          enum: ["Contado", "Credito"]
          example: "Contado"
        monto_neto_pendiente:
          type: "number"
          format: "double"
          description: "Requerido si tipo es Crédito"
          example: 500.00
        cuotas:
          type: "array"
          items:
            $ref: "#/components/schemas/CuotaCredito"

    CuotaCredito:
      type: "object"
      required:
        - "numero"
        - "monto"
        - "fecha_vencimiento"
      properties:
        numero:
          type: "integer"
          example: 1
        monto:
          type: "number"
          format: "double"
          example: 500.00
        fecha_vencimiento:
          type: "string"
          format: "date"
          example: "2026-11-22"

    CdrDto:
      type: "object"
      required:
        - "codigo_respuesta"
        - "descripcion_respuesta"
        - "fecha_recepcion"
      properties:
        codigo_respuesta:
          type: "string"
          description: "Código devuelto por SUNAT/OSE ('0' indica Aceptado, >= 2000 Rechazado)"
          example: "0"
        descripcion_respuesta:
          type: "string"
          example: "La Factura número F001-00000042 ha sido ACEPTADA."
        observaciones:
          type: "array"
          items:
            type: "string"
          example: []
        fecha_recepcion:
          type: "string"
          format: "date-time"
          example: "2026-10-22T10:30:12Z"

    NotaCreditoRequest:
      type: "object"
      required:
        - "serie"
        - "correlativo"
        - "fecha_emision"
        - "moneda"
        - "documento_referenciado"
        - "motivo"
        - "emisor"
        - "receptor"
        - "items"
        - "totales"
      properties:
        serie:
          type: "string"
          pattern: "^[F|B]C[0-9]{2}$"
          example: "FC01"
        correlativo:
          type: "integer"
