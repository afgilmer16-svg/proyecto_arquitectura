      properties:
        id:
          type: "string"
          format: "uuid"
          example: "e4feec99-9c0b-4ef8-bb6d-6bb9bd380a55"
        estado:
          type: "string"
          enum: ["EN_PROCESO", "COMPLETADO", "CON_ERRORES", "FALLIDO"]
