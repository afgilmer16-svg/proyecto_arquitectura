        mensaje:
          type: "string"
          example: "Operación realizada satisfactoriamente."

    ErrorResponse:
      type: "object"
      required:
        - "codigo"
        - "mensaje"
        - "fecha_hora"
      properties:
        codigo:
          type: "string"
          example: "ERR_VALIDACION_FISCAL"
          description: "Código interno del error del sistema"
        mensaje:
          type: "string"
          example: "El comprobante no superó las validaciones del estándar UBL 2.1 o reglas de SUNAT."
        codigo_sunat:
          type: "string"
          nullable: true
          example: "2017"
          description: "Código oficial de error retornado por SUNAT (Catálogo de Errores OSE/SUNAT: e.g. 0100, 2017, 2324)"
        mensaje_sunat:
          type: "string"
          nullable: true
          example: "El RUC del receptor no se encuentra en estado ACTIVO y HABIDO."
        fecha_hora:
          type: "string"
          format: "date-time"
          example: "2026-10-22T10:30:15Z"
        detalles:
          type: "array"
          items:
            type: "string"
          example:
            - "receptor.numero_documento: Dígito verificador de RUC inválido."

    TipoComprobanteEnum:
      type: "string"
      enum: ["01", "03", "07", "08"]
      description: "Catálogo N° 01 SUNAT: '01' Factura, '03' Boleta de Venta, '07' Nota de Crédito, '08' Nota de Débito"
      example: "01"

    EstadoComprobanteEnum:
      type: "string"
      enum: ["EMITIDO", "FIRMADO", "ACEPTADO", "RECHAZADO", "DE_BAJA"]
      example: "ACEPTADO"
