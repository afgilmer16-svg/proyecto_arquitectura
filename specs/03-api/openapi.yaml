openapi: "3.1.0"
info:
  title: "API de Facturación Electrónica SUNAT — ABC Software Corp"
  version: "1.0.0"
  description: |
    API RESTful de facturación electrónica conforme a la **RS N° 097-2012/SUNAT**, **RS N° 234-2006/SUNAT** y el estándar **OASIS UBL 2.1**.
    Diseñada para la emisión, consulta y gestión fiscal de comprobantes de pago (Facturas, Boletas de Venta, Notas de Crédito, Notas de Débito, Comunicaciones de Baja y Resúmenes Diarios) para la empresa de abarrotes ABC Software Corp.
    
    Cada operación documenta su trazabilidad directa con el Caso de Uso del Dominio (**CU-xx**).
  contact:
    name: "Equipo de Arquitectura Grupo A — UNAS-FIIS"
    email: "arquitectura@abcsoftwarecorp.pe"
servers:
  - url: "https://api.facturacion.abcsoftwarecorp.pe/v1"
    description: "Servidor Principal de Producción"
  - url: "https://api-homologacion.facturacion.abcsoftwarecorp.pe/v1"
    description: "Ambiente de Pruebas y Homologación OSE/SUNAT"
  - url: "http://localhost:8080/v1"
    description: "Entorno de Desarrollo Local"

tags:
  - name: "Comprobantes"
    description: "Emisión y consulta de Facturas Electrónicas (01) y Boletas de Venta (03)"
  - name: "Artefactos"
    description: "Descarga de documentos electrónicos: XML UBL 2.1 firmado, PDF (Representación Impresa) y CDR"
  - name: "Notas Modificatorias"
    description: "Emisión de Notas de Crédito (07) y Notas de Débito (08)"
  - name: "Comunicaciones y Resúmenes"
    description: "Comunicaciones de Baja (Anulaciones) y Resúmenes Diarios de Boletas"
  - name: "Contribuyentes"
    description: "Validación de RUC ante padrones oficiales de SUNAT"
  - name: "Clientes"
    description: "Mantenimiento CRUD del maestro de clientes y adquirentes"
  - name: "Productos"
    description: "Mantenimiento CRUD del catálogo de productos y precios de abarrotes"
  - name: "Series"
    description: "Configuración y control secuencial de series y correlativos"
  - name: "Catálogos"
    description: "Consulta de tablas normativas oficiales del Anexo 8 de SUNAT"
  - name: "Migración"
    description: "Importación masiva y conciliación de ventas históricas del sistema legado"

paths:
  /comprobantes:
    post:
      tags:
        - "Comprobantes"
      summary: "Emitir Factura o Boleta de Venta Electrónica"
      operationId: "emitirComprobante"
      description: |
        **Caso de Uso**: `CU-01` (Emitir Factura) / `CU-02` (Emitir Boleta).
        
        Calcula la base imponible e impuestos (IGV 18%, ISC, ICBPER), valida el RUC del receptor ante SUNAT, genera el XML en formato OASIS UBL 2.1, estampa la firma digital XMLDSig con certificado X.509, remite el paquete al Operador de Servicios Electrónicos (OSE) o SUNAT, procesa el CDR y almacena el comprobante.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmitirComprobanteRequest"
            examples:
              factura_abarrotes:
                summary: "Ejemplo válido de Factura Electrónica (Sector Abarrotes con IGV e ICBPER)"
                value:
                  tipo_comprobante: "01"
                  serie: "F001"
                  correlativo: 42
                  fecha_emision: "2026-10-22"
                  hora_emision: "10:30:00"
                  moneda: "PEN"
                  forma_pago:
                    tipo: "Contado"
                  emisor:
                    ruc: "20601234567"
                    razon_social: "ABC SOFTWARE CORP S.A.C."
                    nombre_comercial: "DISTRIBUIDORA DE ABARROTES ABC"
                    direccion: "Av. Universitaria 123, Tingo María, Huánuco"
                    ubigeo: "100601"
                  receptor:
                    tipo_documento: "6"
                    numero_documento: "20555555551"
                    razon_social: "COMERCIALIZADORA SAN JUAN S.A.C."
                    direccion: "Jr. Comercio 456, Rupa Rupa, Leoncio Prado"
                    email: "facturacion@sanjuan.pe"
                  items:
                    - numero_linea: 1
                      codigo_producto: "PROD-ARR-01"
                      descripcion: "Arroz Extra Costeño Saco 50 kg"
                      unidad_medida: "NIU"
                      cantidad: 10
                      valor_unitario: 140.00
                      precio_unitario: 165.20
                      tipo_afectacion_igv: "10"
                      porcentaje_igv: 18.00
                      monto_igv: 252.00
                      monto_icbper: 0.00
                      valor_total: 1400.00
                    - numero_linea: 2
                      codigo_producto: "PROD-ACE-02"
                      descripcion: "Aceite Vegetal Primor Botella 1 Litro (Caja x 12 unidades)"
                      unidad_medida: "BX"
                      cantidad: 5
                      valor_unitario: 80.00
                      precio_unitario: 94.40
                      tipo_afectacion_igv: "10"
                      porcentaje_igv: 18.00
                      monto_igv: 72.00
                      monto_icbper: 0.00
                      valor_total: 400.00
                    - numero_linea: 3
                      codigo_producto: "PROD-BOL-03"
                      descripcion: "Bolsa Plástica Biodegradable 50x70 cm (Afecta a ICBPER)"
                      unidad_medida: "NIU"
                      cantidad: 10
                      valor_unitario: 0.10
                      precio_unitario: 0.32
                      tipo_afectacion_igv: "10"
                      porcentaje_igv: 18.00
                      monto_igv: 0.18
                      monto_icbper: 2.00
                      valor_total: 1.00
                  totales:
                    total_operaciones_gravadas: 1801.00
                    total_operaciones_inafectas: 0.00
                    total_operaciones_exoneradas: 0.00
                    total_igv: 324.18
                    total_isc: 0.00
                    total_icbper: 2.00
                    total_impuestos: 326.18
                    importe_total: 2127.18
      responses:
        "201":
          description: "Comprobante emitido, firmado y aceptado por el OSE/SUNAT."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComprobanteResponse"
        "400":
          description: "Solicitud mal formada, campos obligatorios ausentes o tipos inválidos."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Serie o configuración fiscal no encontrada."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Conflicto: El número de serie y correlativo ya fue emitido previamente."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "Error de validación fiscal o comprobante rechazado por reglas de SUNAT."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: "Fallo de comunicación o timeout con el servicio web del OSE / SUNAT."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      tags:
        - "Comprobantes"
      summary: "Listar comprobantes emitidos con filtros"
      operationId: "listarComprobantes"
      description: |
        **Caso de Uso**: `CU-05` (Consultar Comprobantes).
        
        Permite buscar y filtrar comprobantes por rango de fechas, tipo de documento, estado tributario y RUC del receptor.
      parameters:
        - name: "fecha_desde"
          in: "query"
          required: false
          schema:
            type: "string"
            format: "date"
          description: "Fecha de inicio del rango de emisión (AAAA-MM-DD)"
        - name: "fecha_hasta"
          in: "query"
          required: false
          schema:
            type: "string"
            format: "date"
          description: "Fecha final del rango de emisión (AAAA-MM-DD)"
        - name: "tipo_comprobante"
          in: "query"
          required: false
          schema:
            $ref: "#/components/schemas/TipoComprobanteEnum"
          description: "Código de catálogo 01: '01' Factura, '03' Boleta, '07' NC, '08' ND"
        - name: "estado"
          in: "query"
          required: false
          schema:
            $ref: "#/components/schemas/EstadoComprobanteEnum"
          description: "Estado del comprobante: EMITIDO, ACEPTADO, RECHAZADO, DE_BAJA"
        - name: "ruc_receptor"
          in: "query"
          required: false
          schema:
            type: "string"
            pattern: "^[0-9]{11}$"
          description: "Filtrar por RUC del cliente"
        - name: "page"
          in: "query"
          required: false
          schema:
            type: "integer"
            default: 1
            minimum: 1
          description: "Número de página para paginación"
        - name: "page_size"
          in: "query"
          required: false
          schema:
            type: "integer"
            default: 20
            maximum: 100
          description: "Cantidad de registros por página"
      responses:
        "200":
          description: "Lista paginada de comprobantes encontrados."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComprobanteListResponse"
        "400":
          description: "Parámetros de consulta inválidos."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /comprobantes/{id}:
    get:
      tags:
        - "Comprobantes"
      summary: "Obtener detalle de comprobante por ID"
      operationId: "obtenerComprobantePorId"
      description: |
        **Caso de Uso**: `CU-05` (Consultar Estado Comprobante).
        
        Recupera el estado actual, datos completos, desglose de impuestos y constancia CDR del comprobante especificado por su UUID o identificador único.
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
          description: "Identificador único (UUID) del comprobante"
      responses:
        "200":
          description: "Comprobante encontrado con estado y CDR asociado."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComprobanteResponse"
        "404":
          description: "El comprobante solicitado no existe."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /comprobantes/{id}/xml:
    get:
      tags:
        - "Artefactos"
      summary: "Descargar archivo XML UBL 2.1 firmado"
      operationId: "descargarXmlComprobante"
      description: |
        **Caso de Uso**: `CU-06` (Descargar Artefactos Electrónicos).
        
        Descarga el archivo XML oficial conforme al estándar OASIS UBL 2.1 con la firma digital estampada en el nodo `ext:UBLExtensions`.
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
          description: "UUID del comprobante"
      responses:
        "200":
          description: "Archivo XML UBL 2.1 firmado descargado con éxito."
          content:
            application/xml:
              schema:
                type: "string"
                format: "binary"
        "404":
          description: "Comprobante o archivo XML no encontrado."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /comprobantes/{id}/pdf:
    get:
      tags:
        - "Artefactos"
      summary: "Descargar Representación Impresa (PDF)"
      operationId: "descargarPdfComprobante"
      description: |
        **Caso de Uso**: `CU-06` (Descargar Artefactos Electrónicos).
        
        Genera y descarga la representación impresa en formato PDF que incluye el código de barras bidimensional QR reglamentario de SUNAT y el valor resumen hash SHA-256.
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
          description: "UUID del comprobante"
      responses:
        "200":
          description: "Documento PDF generado correctamente."
          content:
            application/pdf:
              schema:
                type: "string"
                format: "binary"
        "404":
          description: "Comprobante no encontrado."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /comprobantes/{id}/cdr:
    get:
      tags:
        - "Artefactos"
      summary: "Descargar Constancia de Recepción (CDR) de SUNAT/OSE"
      operationId: "descargarCdrComprobante"
      description: |
        **Caso de Uso**: `CU-06` (Descargar Artefactos Electrónicos).
        
        Descarga el archivo XML de la Constancia de Recepción (CDR) emitido y firmado por el OSE o SUNAT, certificando la validez tributaria.
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
          description: "UUID del comprobante"
      responses:
        "200":
          description: "Constancia de Recepción XML obtenida."
          content:
            application/xml:
              schema:
                type: "string"
                format: "binary"
        "404":
          description: "El comprobante no posee CDR (aún en procesamiento o no existe)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /notas-credito:
    post:
      tags:
        - "Notas Modificatorias"
      summary: "Emitir Nota de Crédito Electrónica (07)"
      operationId: "emitirNotaCredito"
      description: |
        **Caso de Uso**: `CU-03` (Emitir Nota de Crédito).
        
        Emite una nota de crédito vinculada a una Factura o Boleta previa, aplicando causales de anulación, devolución o descuento según el Catálogo N° 09 de SUNAT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotaCreditoRequest"
      responses:
        "201":
          description: "Nota de Crédito emitida y aceptada con CDR."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComprobanteResponse"
        "400":
          description: "Datos requeridos ausentes o motivo de nota inválido."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "El comprobante referenciado que se desea modificar no existe."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Serie y correlativo de la Nota de Crédito duplicado."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "Rechazo de validación fiscal por SUNAT/OSE."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: "Error de comunicación con OSE o SUNAT."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /notas-debito:
    post:
      tags:
        - "Notas Modificatorias"
      summary: "Emitir Nota de Débito Electrónica (08)"
      operationId: "emitirNotaDebito"
      description: |
        **Caso de Uso**: `CU-04` (Emitir Nota de Débito).
        
        Emite una nota de débito para aumentar el valor de una Factura o Boleta previa por intereses, moras o gastos adicionales según el Catálogo N° 10 de SUNAT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotaDebitoRequest"
      responses:
        "201":
          description: "Nota de Débito emitida y aceptada con CDR."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComprobanteResponse"
        "400":
          description: "Solicitud inválida o causal no reconocida."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Comprobante referenciado no encontrado."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Correlativo duplicado."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "Validación tributaria rechazada."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: "Fallo de conexión externa."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /comunicaciones-baja:
    post:
      tags:
        - "Comunicaciones y Resúmenes"
      summary: "Enviar Comunicación de Baja (Anulación de Comprobantes)"
      operationId: "enviarComunicacionBaja"
      description: |
        **Caso de Uso**: `CU-07` (Comunicar de Baja Comprobante).
        
        Genera el documento XML `UBL-VoidedDocuments-1.0` y lo remite a SUNAT para solicitar la baja de facturas o notas emitidas dentro del plazo reglamentario de 7 días calendario.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComunicacionBajaRequest"
      responses:
        "201":
          description: "Comunicación de baja procesada exitosamente."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketResponse"
        "400":
          description: "Parámetros de baja incorrectos o fuera de plazo normativo."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "El comprobante a dar de baja no existe en el sistema."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "El comprobante ya se encuentra dado de baja previamente."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "Rechazo por parte de SUNAT."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: "Error de conexión con SUNAT/OSE."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /resumenes-diarios:
    post:
      tags:
        - "Comunicaciones y Resúmenes"
      summary: "Generar y Enviar Resumen Diario de Boletas de Venta"
      operationId: "enviarResumenDiario"
      description: |
        **Caso de Uso**: `CU-08` (Generar y Enviar Resumen Diario).
        
        Consolida todas las boletas de venta electrónicas emitidas en la fecha indicada y envía el resumen `UBL-SummaryDocuments-1.0` a SUNAT para su aprobación por lotes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResumenDiarioRequest"
      responses:
        "201":
          description: "Resumen diario recibido por SUNAT; ticket de consulta generado."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketResponse"
        "400":
          description: "Fecha o parámetros del resumen incorrectos."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "No se encontraron boletas pendientes de informar para la fecha."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Ya se envió un resumen diario con el mismo identificador de lote."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "Validación de esquema de resumen rechazada por SUNAT."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: "Error al remitir a SUNAT/OSE."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /contribuyentes/{ruc}/validar:
    get:
      tags:
        - "Contribuyentes"
      summary: "Validar RUC y consultar padrón SUNAT"
      operationId: "validarContribuyenteRuc"
      description: |
        **Caso de Uso**: `CU-09` (Validar Contribuyente).
        
        Verifica el algoritmo Módulo 11 del RUC y consulta el padrón de SUNAT para corroborar razón social, estado tributario (ACTIVO) y condición de domicilio (HABIDO).
      parameters:
        - name: "ruc"
          in: "path"
          required: true
          schema:
            type: "string"
            pattern: "^[0-9]{11}$"
          description: "Número de RUC de 11 dígitos"
          example: "20601234567"
      responses:
        "200":
          description: "RUC válido y datos del padrón recuperados."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContribuyenteValidadoResponse"
        "400":
          description: "El formato del RUC es inválido o no supera el algoritmo Módulo 11."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "El RUC no fue encontrado en los registros tributarios de SUNAT."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: "Error al consultar el servicio web de padrón de SUNAT."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /clientes:
    get:
      tags:
        - "Clientes"
      summary: "Listar clientes registrados"
      operationId: "listarClientes"
      description: "**Caso de Uso**: `CU-10` (Gestionar Clientes y Receptores)."
      parameters:
        - name: "query"
          in: "query"
          required: false
          schema:
            type: "string"
          description: "Buscar por RUC, DNI o razón social"
        - name: "page"
          in: "query"
          required: false
          schema:
            type: "integer"
            default: 1
        - name: "page_size"
          in: "query"
          required: false
          schema:
            type: "integer"
            default: 20
      responses:
        "200":
          description: "Lista de clientes obtenida."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClienteListResponse"
    post:
      tags:
        - "Clientes"
      summary: "Crear un nuevo cliente"
      operationId: "crearCliente"
      description: "**Caso de Uso**: `CU-10` (Gestionar Clientes y Receptores)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClienteRequest"
      responses:
        "201":
          description: "Cliente creado exitosamente."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClienteResponse"
        "400":
          description: "Datos del cliente inválidos."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "El cliente ya se encuentra registrado con ese documento."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /clientes/{id}:
    get:
      tags:
        - "Clientes"
      summary: "Obtener cliente por ID"
      operationId: "obtenerClientePorId"
      description: "**Caso de Uso**: `CU-10` (Gestionar Clientes y Receptores)."
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        "200":
          description: "Datos del cliente."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClienteResponse"
        "404":
          description: "Cliente no encontrado."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
        - "Clientes"
      summary: "Actualizar datos de cliente"
      operationId: "actualizarCliente"
      description: "**Caso de Uso**: `CU-10` (Gestionar Clientes y Receptores)."
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
