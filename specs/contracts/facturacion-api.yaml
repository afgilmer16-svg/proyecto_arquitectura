          type: "integer"
          example: 1
        monto:
          type: "string"
          pattern: "^[0-9]+(\\.[0-9]{1,10})?$"
          description: "Monto de la cuota. Decimal exacto como texto."
          example: "500.00"
        fecha_vencimiento:
          type: "string"
          format: "date"
          example: "2026-11-22"

    CdrDto:
      type: "object"
      required:
        - "codigo_respuesta"
        - "descripcion_respuesta"
        - "fecha_recepcion"
      properties:
        codigo_respuesta:
          type: "string"
          description: |
            Código devuelto por SUNAT/OSE:
            - `'0'`: Aceptado sin observaciones.
            - `100` a `1999`: excepción; SUNAT/OSE no procesó el archivo y no emite CDR de aceptación. Se corrige y se reenvía. ⚠️ Por verificar rango contra el Manual del Programador [F-05].
            - `2000` a `3999`: Rechazado; el comprobante no es válido y se emite uno nuevo con otro correlativo.
            - `4000` en adelante: Aceptado con observaciones (el comprobante queda válido).
          example: "0"
        descripcion_respuesta:
          type: "string"
          example: "La Factura número F001-00000042 ha sido ACEPTADA."
        observaciones:
          type: "array"
          items:
            type: "string"
          example: []
        fecha_recepcion:
          type: "string"
          format: "date-time"
          example: "2026-10-22T10:30:12Z"

    NotaCreditoRequest:
      type: "object"
      required:
