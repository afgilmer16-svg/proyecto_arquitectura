        monto_neto_pendiente:
          type: "string"
          pattern: "^[0-9]+(\\.[0-9]{1,10})?$"
          description: "Monto neto pendiente de pago. Requerido si tipo es Crédito. Decimal exacto como texto."
          example: "500.00"
