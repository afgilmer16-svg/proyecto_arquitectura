        tipo_comprobante:
          $ref: "#/components/schemas/TipoComprobanteEnum"
        codigo_serie:
          type: "string"
          example: "F001"
        correlativo_actual:
          type: "integer"
          example: 42
        activa:
          type: "boolean"
          example: true

    SerieListResponse:
      type: "object"
      required:
