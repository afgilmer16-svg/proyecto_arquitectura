    MigracionLegadoRequest:
      type: "object"
      description: "Importación histórica. Nunca emite, firma ni envía comprobantes a OSE/SUNAT: las referencias de comprobantes se guardan como históricas (origen = LEGADO, es_historico = true)."
      required:
        - "tipo_entidad"
        - "formato_origen"
        - "contenido_base64"
      properties:
        tipo_entidad:
          type: "string"
          enum: ["PRODUCTOS", "MOVIMIENTOS_ALMACEN", "REFERENCIAS_COMPROBANTES", "CLIENTES"]
          example: "MOVIMIENTOS_ALMACEN"
        formato_origen:
          type: "string"
          enum: ["CSV", "JSON", "DBF"]
          example: "CSV"
        contenido_base64:
          type: "string"
          format: "byte"
          description: "Contenido codificado en base64 del archivo a migrar"

    MigracionResponse:
      type: "object"
      required:
        - "id"
        - "estado"
        - "registros_totales"
        - "registros_procesados"
        - "registros_fallidos"
        - "fecha_inicio"
