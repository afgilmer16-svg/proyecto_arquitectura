    EstadoCuarentenaEnum:
      type: "string"
      enum: ["PENDIENTE", "CORREGIDO", "DESCARTADO_AUTORIZADO"]
      example: "PENDIENTE"

    CodigoErrorCuarentenaEnum:
      type: "string"
      description: "Códigos estables del catálogo de errores de cuarentena (`specs/features/0006-migracion-legado/design.md`)."
      enum:
        - "FECHA_INVALIDA"
        - "FECHA_AMBIGUA"
        - "FECHA_AUSENTE"
        - "CANTIDAD_NO_NUMERICA"
        - "CANTIDAD_NEGATIVA"
        - "MOVIMIENTO_DOBLE"
        - "MOVIMIENTO_VACIO"
        - "PRODUCTO_VACIO"
        - "PRODUCTO_NO_ENCONTRADO"
        - "PRODUCTO_AMBIGUO"
        - "DOCUMENTO_AMBIGUO"
        - "DOCUMENTO_DUPLICADO_CONFLICTIVO"
        - "SIN_DOCUMENTO_ORIGEN"
        - "CODIFICACION_INVALIDA"
        - "COLISION_LEGADO_ID"
      example: "FECHA_AMBIGUA"

    CuarentenaRegistro:
      type: "object"
      required:
        - "id"
        - "lote_id"
        - "legado_id"
        - "tipo_entidad"
        - "fila_original"
        - "codigos_error"
        - "intentos"
        - "estado"
        - "fecha_registro"
      properties:
        id:
          type: "string"
          format: "uuid"
        lote_id:
          type: "string"
          format: "uuid"
        legado_id:
          type: "string"
          example: "legado:movimientos:1042"
          description: "Clave original o sintética reproducible (`sistema:tabla:clave`)."
        tipo_entidad:
          type: "string"
          enum: ["PRODUCTO", "MOVIMIENTO_ALMACEN", "COMPROBANTE"]
        fila_original:
          type: "object"
          additionalProperties:
            type: "string"
          description: "Valores originales conservados como texto, sin transformar."
          example:
            fecha: "05/06/2026"
            ingreso: "10"
            salida: ""
            producto: "A1"
            nro_documento: "F001-42"
        fila_normalizada:
          type:
            - "object"
            - "null"
          additionalProperties: true
          description: "Resultado parcial de la normalización, si llegó a producirse."
        codigos_error:
          type: "array"
          minItems: 1
          items:
            $ref: "#/components/schemas/CodigoErrorCuarentenaEnum"
        intentos:
          type: "integer"
          minimum: 0
          example: 0
        estado:
          $ref: "#/components/schemas/EstadoCuarentenaEnum"
        fecha_registro:
          type: "string"
          format: "date-time"

    CuarentenaListaResponse:
      type: "object"
      required:
        - "elementos"
        - "pagina"
        - "tamano"
        - "total"
      properties:
        elementos:
          type: "array"
          items:
            $ref: "#/components/schemas/CuarentenaRegistro"
        pagina:
          type: "integer"
          minimum: 1
        tamano:
          type: "integer"
          minimum: 1
        total:
          type: "integer"
          minimum: 0

    ParcheCuarentena:
      description: "Corrección o descarte autorizado de un registro en cuarentena. Se guarda como parche separado; no altera la extracción original. `CORREGIR` exige `campo` y `valor_corregido`; `DESCARTAR` marca el registro como `DESCARTADO_AUTORIZADO`."
      oneOf:
        - $ref: "#/components/schemas/ParcheCorregir"
        - $ref: "#/components/schemas/ParcheDescartar"
      discriminator:
        propertyName: "accion"
        mapping:
          CORREGIR: "#/components/schemas/ParcheCorregir"
          DESCARTAR: "#/components/schemas/ParcheDescartar"

    ParcheCorregir:
      type: "object"
      description: "Aplica `valor_corregido` al campo indicado y vuelve a validar el registro."
      required:
        - "legado_id"
        - "accion"
        - "campo"
        - "valor_corregido"
        - "motivo"
        - "evidencia"
        - "aprobado_por"
      properties:
        accion:
          type: "string"
          const: "CORREGIR"
        campo:
          type: "string"
          enum: ["fecha", "ingreso", "salida", "producto", "nro_documento"]
          description: "Campo del sistema antiguo que se corrige."
        valor_corregido:
          type: "string"
          minLength: 1
          description: "Nuevo valor como texto, tal como se interpretaría desde el origen."
        legado_id:
          type: "string"
          example: "legado:movimientos:1042"
        motivo:
          type: "string"
          minLength: 10
          maxLength: 500
        evidencia:
          type: "string"
          minLength: 5
          maxLength: 500
          description: "Referencia verificable que respalda el cambio (documento, hoja, fila). Sin evidencia el parche se rechaza con 422."
        aprobado_por:
          type: "string"
          minLength: 3
          maxLength: 120
          description: "Usuario que aprueba el parche; queda en la auditoría."

    ParcheDescartar:
      type: "object"
      description: "Descarta el registro con autorización; queda como `DESCARTADO_AUTORIZADO` en la auditoría."
      required:
        - "legado_id"
        - "accion"
        - "motivo"
        - "evidencia"
        - "aprobado_por"
      properties:
        accion:
          type: "string"
          const: "DESCARTAR"
        legado_id:
          type: "string"
          example: "legado:movimientos:1042"
        motivo:
          type: "string"
          minLength: 10
          maxLength: 500
        evidencia:
          type: "string"
          minLength: 5
          maxLength: 500
          description: "Referencia verificable que respalda el cambio (documento, hoja, fila). Sin evidencia el parche se rechaza con 422."
        aprobado_por:
          type: "string"
          minLength: 3
          maxLength: 120
          description: "Usuario que aprueba el parche; queda en la auditoría."

    ReprocesoCuarentenaRequest:
      type: "object"
      required:
        - "version_reglas"
        - "parches"
      properties:
        version_reglas:
          type: "string"
          pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
          example: "1.0.0"
          description: "Versión de las reglas de mapeo/limpieza: la misma del lote original o una posterior."
        parches:
          type: "array"
          minItems: 1
          maxItems: 1000
          items:
            $ref: "#/components/schemas/ParcheCuarentena"

    OperacionExitosaResponse:
      type: "object"
      required:
        - "exito"
        - "mensaje"
      properties:
        exito:
          type: "boolean"
          example: true
        mensaje:
          type: "string"
          example: "Operación realizada satisfactoriamente."

    ErrorResponse:
      type: "object"
      required:
        - "codigo"
        - "mensaje"
        - "fecha_hora"
      properties:
        codigo:
          type: "string"
          example: "ERR_VALIDACION_FISCAL"
          description: "Código interno del error del sistema"
        mensaje:
          type: "string"
          example: "El comprobante no superó las validaciones del estándar UBL 2.1 o reglas de SUNAT."
        codigo_sunat:
          type: ["string", "null"]
          example: "2017"
          description: "Código oficial de error retornado por SUNAT (Catálogo de Errores OSE/SUNAT: e.g. 0100, 2017, 2324)"
        mensaje_sunat:
          type: ["string", "null"]
          example: "El RUC del receptor no se encuentra en estado ACTIVO y HABIDO."
        fecha_hora:
          type: "string"
          format: "date-time"
          example: "2026-10-22T10:30:15Z"
        detalles:
          type: "array"
          items:
            type: "string"
          example:
            - "receptor.numero_documento: Dígito verificador de RUC inválido."

    TipoComprobanteEnum:
      type: "string"
      enum: ["01", "03", "07", "08"]
      description: "Catálogo N° 01 SUNAT: '01' Factura, '03' Boleta de Venta, '07' Nota de Crédito, '08' Nota de Débito"
      example: "01"

    EstadoComprobanteEnum:
      type: "string"
      enum: ["EMITIDO", "FIRMADO", "ACEPTADO", "RECHAZADO", "DE_BAJA"]
      example: "ACEPTADO"

  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
      description: |
        Autenticación mediante JSON Web Token (JWT). Incluir el token en la cabecera HTTP:
        `Authorization: Bearer <token>`
        
        Los tokens se obtienen del endpoint de autenticación del sistema y tienen una vigencia configurable.
        Respuestas de error relacionadas:
        - **401 Unauthorized**: Token ausente, inválido o expirado.
        - **403 Forbidden**: Token válido pero sin permisos suficientes para la operación solicitada.
