    ProductoRequest:
      type: "object"
      required:
        - "codigo"
        - "descripcion"
        - "unidad_medida"
        - "valor_unitario"
        - "tipo_afectacion_igv"
      properties:
        codigo:
          type: "string"
          example: "PROD-ARR-01"
        descripcion:
          type: "string"
          example: "Arroz Extra Costeño Saco 50 kg"
        unidad_medida:
          $ref: "#/components/schemas/UnidadMedidaEnum"
        valor_unitario:
          type: "string"
          pattern: "^[0-9]+(\\.[0-9]{1,10})?$"
          example: "140.00"
        tipo_afectacion_igv:
          $ref: "#/components/schemas/TipoAfectacionIgvEnum"
        sistema_isc:
          $ref: "#/components/schemas/SistemaIscEnum"
        tasa_isc:
          type: "string"
          pattern: "^[0-9]{1,3}\\.[0-9]{2}$"
          description: "Tasa porcentual del ISC vigente para el producto (sistemas 01 y 03). Decimal exacto como texto."
          example: "17.00"
        monto_fijo_isc:
          type: "string"
          pattern: "^[0-9]+(\\.[0-9]{1,10})?$"
          description: "Monto fijo de ISC por unidad física (sistema 02)."
          example: "1.25"
        unidad_base_isc:
          $ref: "#/components/schemas/UnidadMedidaEnum"
        precio_venta_publico_sugerido:
          type: "string"
          pattern: "^[0-9]+(\\.[0-9]{1,10})?$"
          description: "PVP sugerido del fabricante (sistema 03)."
          example: "5.00"
        es_bolsa_plastica:
          type: "boolean"
          default: false
          description: "Indica si el producto está sujeto a impuesto ICBPER"
          example: false
      allOf:
        - if:
            required: ["sistema_isc"]
            properties:
              sistema_isc:
                const: "01"
          then:
            required: ["tasa_isc"]
            properties:
              tasa_isc:
                type: "string"
        - if:
            required: ["sistema_isc"]
            properties:
              sistema_isc:
                const: "02"
          then:
            required: ["monto_fijo_isc", "unidad_base_isc"]
            properties:
              monto_fijo_isc:
                type: "string"
              unidad_base_isc:
                $ref: "#/components/schemas/UnidadMedidaEnum"
        - if:
            required: ["sistema_isc"]
            properties:
              sistema_isc:
                const: "03"
          then:
            required: ["tasa_isc", "precio_venta_publico_sugerido"]
            properties:
              tasa_isc:
                type: "string"
              precio_venta_publico_sugerido:
                type: "string"

    ProductoResponse:
      type: "object"
      required:
        - "id"
        - "codigo"
        - "descripcion"
        - "unidad_medida"
        - "valor_unitario"
        - "tipo_afectacion_igv"
        - "activo"
      properties:
        id:
          type: "string"
          format: "uuid"
          example: "c2deec99-9c0b-4ef8-bb6d-6bb9bd380a33"
        codigo:
          type: "string"
          example: "PROD-ARR-01"
        descripcion:
          type: "string"
          example: "Arroz Extra Costeño Saco 50 kg"
        unidad_medida:
          $ref: "#/components/schemas/UnidadMedidaEnum"
        valor_unitario:
          type: "string"
          example: "140.00"
        tipo_afectacion_igv:
          $ref: "#/components/schemas/TipoAfectacionIgvEnum"
        sistema_isc:
          $ref: "#/components/schemas/SistemaIscEnum"
        tasa_isc:
          type: "string"
          pattern: "^[0-9]{1,3}\\.[0-9]{2}$"
          description: "Tasa porcentual del ISC vigente para el producto (sistemas 01 y 03). Decimal exacto como texto."
          example: "17.00"
        monto_fijo_isc:
          type: "string"
          pattern: "^[0-9]+(\\.[0-9]{1,10})?$"
          description: "Monto fijo de ISC por unidad física (sistema 02)."
          example: "1.25"
        unidad_base_isc:
          $ref: "#/components/schemas/UnidadMedidaEnum"
        precio_venta_publico_sugerido:
          type: "string"
          pattern: "^[0-9]+(\\.[0-9]{1,10})?$"
          description: "PVP sugerido del fabricante (sistema 03)."
          example: "5.00"
        es_bolsa_plastica:
          type: "boolean"
          example: false
        activo:
          type: "boolean"
          example: true

