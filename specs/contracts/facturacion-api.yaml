    SerieRequest:
      type: "object"
      description: |
        Solicitud para crear o habilitar una serie. El correlativo es gestionado atómicamente por el servidor; el cliente no puede enviarlo ni modificarlo para evitar regresión de numeración.
      required:
        - "tipo_comprobante"
        - "codigo_serie"
      properties:
        tipo_comprobante:
          $ref: "#/components/schemas/TipoComprobanteEnum"
        codigo_serie:
          type: "string"
          pattern: "^[FB][A-Z0-9]{3}$"
          description: "Serie: F seguido de 3 alfanuméricos para Factura (tipo 01); B seguido de 3 alfanuméricos para Boleta (tipo 03). Para notas de crédito y débito la serie conserva el prefijo del documento afectado (F o B). El servidor rechaza con 422 un prefijo que no coincida con el tipo de comprobante (01 con F, 03 con B)."
          example: "F001"

    SerieUpdateRequest:
      type: "object"
      description: "Actualización de una serie. Solo admite descripción y estado; ni el tipo, ni el código ni el `correlativo_actual` son modificables (evita retroceder la numeración)."
      additionalProperties: false
      minProperties: 1
      properties:
        descripcion:
          type: "string"
          maxLength: 100
          example: "Serie de facturas - caja 1"
        activa:
          type: "boolean"
          example: true

