openapi: "3.1.0"
info:
  title: "API de Facturación Electrónica SUNAT — ABC Software Corp"
  version: "1.0.0"
  description: |
    API RESTful de facturación electrónica conforme a la **RS N° 097-2012/SUNAT**, **RS N° 234-2006/SUNAT** y el estándar **OASIS UBL 2.1**.
    Diseñada para la emisión, consulta y gestión fiscal de comprobantes de pago (Facturas, Boletas de Venta, Notas de Crédito, Notas de Débito, Comunicaciones de Baja y Resúmenes Diarios) para la empresa de abarrotes ABC Software Corp.
    
    Cada operación documenta su trazabilidad directa con el Caso de Uso del Dominio (**CU-xx**).
  contact:
    name: "Equipo de Arquitectura Grupo A — UNAS-FIIS"
    email: "arquitectura@abcsoftwarecorp.pe"
  license:
    name: "Uso académico — UNAS-FIIS"
    url: "https://www.unas.edu.pe"
servers:
  - url: "https://api.facturacion.abcsoftwarecorp.pe/v1"
    description: "Servidor Principal de Producción"
  - url: "https://api-homologacion.facturacion.abcsoftwarecorp.pe/v1"
    description: "Ambiente de Pruebas y Homologación OSE/SUNAT"

security:
  - bearerAuth: []

tags:
  - name: "Libros Electrónicos"
    description: "Registro de Ventas (PLE 14.1) y Registro de Inventario Permanente (PLE 12.1)"
  - name: "Comprobantes"
    description: "Emisión y consulta de Facturas Electrónicas (01) y Boletas de Venta (03)"
  - name: "Artefactos"
    description: "Descarga de documentos electrónicos: XML UBL 2.1 firmado, PDF (Representación Impresa) y CDR"
  - name: "Notas Modificatorias"
    description: "Emisión de Notas de Crédito (07) y Notas de Débito (08)"
  - name: "Comunicaciones y Resúmenes"
    description: "Comunicaciones de Baja (Anulaciones) y Resúmenes Diarios de Boletas"
  - name: "Contribuyentes"
    description: "Validación de RUC ante padrones oficiales de SUNAT"
  - name: "Clientes"
    description: "Mantenimiento CRUD del maestro de clientes y adquirentes"
  - name: "Productos"
    description: "Mantenimiento CRUD del catálogo de productos y precios de abarrotes"
  - name: "Series"
    description: "Configuración y control secuencial de series y correlativos"
  - name: "Catálogos"
    description: "Consulta de tablas normativas oficiales del Anexo 8 de SUNAT"
  - name: "Migración"
    description: "Importación masiva y conciliación de ventas históricas del sistema legado"

paths:
  /comprobantes:
    post:
      tags:
        - "Comprobantes"
      summary: "Emitir Factura o Boleta de Venta Electrónica"
      operationId: "emitirComprobante"
      description: |
        **Caso de Uso**: `CU-01` (Emitir Factura) / `CU-02` (Emitir Boleta).
        
        Calcula (el cliente no envía montos de impuestos ni totales) la base imponible e impuestos (IGV 18%, ISC, ICBPER), valida el RUC del receptor ante SUNAT, genera el XML en formato OASIS UBL 2.1, estampa la firma digital XMLDSig con certificado X.509, remite el paquete al Operador de Servicios Electrónicos (OSE) o SUNAT, procesa el CDR y almacena el comprobante.
      parameters:
        - name: "Idempotency-Key"
          in: "header"
          required: false
          schema:
            type: "string"
            format: "uuid"
          description: "UUID generado por el cliente para el comando. Si el servidor ya procesó ese UUID, devuelve el resultado original sin crear un segundo comprobante (modo sin conexión, ADR-003)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmitirComprobanteRequest"
            examples:
              factura_abarrotes:
                summary: "Ejemplo válido de Factura Electrónica (Sector Abarrotes con IGV e ICBPER)"
                value:
                  tipo_comprobante: "01"
                  serie: "F001"
                  fecha_emision: "2026-10-22"
                  hora_emision: "10:30:00"
                  moneda: "PEN"
                  forma_pago:
                    tipo: "Contado"
                  emisor:
                    ruc: "20601234565"
                    razon_social: "ABC SOFTWARE CORP S.A.C."
                    nombre_comercial: "DISTRIBUIDORA DE ABARROTES ABC"
                    direccion: "Av. Universitaria 123, Tingo María, Huánuco"
                    ubigeo: "100601"
                  receptor:
                    tipo_documento: "6"
                    numero_documento: "20555555556"
                    razon_social: "COMERCIALIZADORA SAN JUAN S.A.C."
                    direccion: "Jr. Comercio 456, Rupa Rupa, Leoncio Prado"
                    email: "facturacion@sanjuan.pe"
                  items:
                    - numero_linea: 1
                      codigo_producto: "PROD-ARR-01"
                      descripcion: "Arroz Extra Costeño Saco 50 kg"
                      unidad_medida: "SA"
                      cantidad: "10"
                      valor_unitario: "140.00"
                      tipo_afectacion_igv: "10"
                    - numero_linea: 2
                      codigo_producto: "PROD-ACE-02"
                      descripcion: "Aceite Vegetal Primor Botella 1 Litro (Caja x 12 unidades)"
                      unidad_medida: "BX"
                      cantidad: "5"
                      valor_unitario: "80.00"
                      tipo_afectacion_igv: "10"
                    - numero_linea: 3
                      codigo_producto: "PROD-BOL-03"
                      descripcion: "Bolsa Plástica 50x70 cm (afecta a ICBPER)"
                      unidad_medida: "NIU"
                      cantidad: "10"
                      valor_unitario: "0.10"
                      tipo_afectacion_igv: "10"
                      cantidad_bolsas: 10
      responses:
        "201":
          description: "Comprobante emitido, firmado y aceptado por el OSE/SUNAT."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComprobanteResponse"
              example:
                id: "a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11"
                tipo_comprobante: "01"
                serie: "F001"
                correlativo: 42
                fecha_emision: "2026-10-22"
                moneda: "PEN"
                importe_total: "2130.18"
                estado: "ACEPTADO"
                items:
                  - {numero_linea: 1, codigo_producto: "PROD-ARR-01", descripcion: "Arroz Extra Costeño Saco 50 kg", unidad_medida: "SA", cantidad: "10", valor_unitario: "140.00", precio_unitario: "165.20", tipo_afectacion_igv: "10", valor_total: "1400.00", monto_isc: "0.00", monto_igv: "252.00", monto_icbper: "0.00"}
                  - {numero_linea: 2, codigo_producto: "PROD-ACE-02", descripcion: "Aceite Vegetal Primor Botella 1 Litro (Caja x 12 unidades)", unidad_medida: "BX", cantidad: "5", valor_unitario: "80.00", precio_unitario: "94.40", tipo_afectacion_igv: "10", valor_total: "400.00", monto_isc: "0.00", monto_igv: "72.00", monto_icbper: "0.00"}
                  - {numero_linea: 3, codigo_producto: "PROD-BOL-03", descripcion: "Bolsa Plástica 50x70 cm (afecta a ICBPER)", unidad_medida: "NIU", cantidad: "10", valor_unitario: "0.10", precio_unitario: "0.118", tipo_afectacion_igv: "10", valor_total: "1.00", monto_isc: "0.00", monto_igv: "0.18", monto_icbper: "5.00"}
                totales: {total_valor_venta: "1801.00", total_operaciones_gravadas: "1801.00", total_operaciones_inafectas: "0.00", total_operaciones_exoneradas: "0.00", total_igv: "324.18", total_isc: "0.00", total_icbper: "5.00", total_impuestos: "329.18", total_precio_venta: "2130.18", total_descuentos: "0.00", total_cargos: "0.00", importe_total: "2130.18"}
                hash_sha256: "4v8K+qK20yD...SHA256HASH=="
                cdr: {codigo_respuesta: "0", descripcion_respuesta: "La Factura número F001-00000042 ha sido ACEPTADA.", observaciones: [], fecha_recepcion: "2026-10-22T10:30:12Z"}
                fecha_registro: "2026-10-22T10:30:15Z"
        "400":
          description: "Solicitud mal formada, campos obligatorios ausentes o tipos inválidos."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "No autenticado. Token JWT ausente, inválido o expirado."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "No autorizado. El usuario autenticado no tiene permiso para emitir comprobantes."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Conflicto: serie y correlativo ya emitidos previamente."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "Error de validación fiscal: RUC inexistente, serie no configurada para el tipo de comprobante indicado, o reglas de SUNAT no cumplidas."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: "Fallo de comunicación o timeout con el servicio web del OSE / SUNAT."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      tags:
        - "Comprobantes"
      summary: "Listar comprobantes emitidos con filtros"
      operationId: "listarComprobantes"
      description: |
        **Caso de Uso**: `CU-05` (Consultar Comprobantes).
        
        Permite buscar y filtrar comprobantes por rango de fechas, tipo de documento, estado tributario y RUC del receptor.
      parameters:
        - name: "fecha_desde"
          in: "query"
          required: false
          schema:
            type: "string"
            format: "date"
          description: "Fecha de inicio del rango de emisión (AAAA-MM-DD)"
        - name: "fecha_hasta"
          in: "query"
          required: false
          schema:
            type: "string"
            format: "date"
          description: "Fecha final del rango de emisión (AAAA-MM-DD)"
        - name: "tipo_comprobante"
          in: "query"
          required: false
          schema:
            $ref: "#/components/schemas/TipoComprobanteEnum"
          description: "Código de catálogo 01: '01' Factura, '03' Boleta, '07' NC, '08' ND"
        - name: "estado"
          in: "query"
          required: false
          schema:
            $ref: "#/components/schemas/EstadoComprobanteEnum"
          description: "Estado del comprobante: EMITIDO, ACEPTADO, RECHAZADO, DE_BAJA"
        - name: "ruc_receptor"
          in: "query"
          required: false
          schema:
            type: "string"
            pattern: "^[0-9]{11}$"
          description: "Filtrar por RUC del cliente"
        - name: "page"
          in: "query"
          required: false
          schema:
            type: "integer"
            default: 1
            minimum: 1
          description: "Número de página para paginación"
        - name: "page_size"
          in: "query"
          required: false
          schema:
            type: "integer"
            default: 20
            maximum: 100
          description: "Cantidad de registros por página"
      responses:
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/NoAutorizado"
        "200":
          description: "Lista paginada de comprobantes encontrados."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComprobanteListResponse"
        "400":
          description: "Parámetros de consulta inválidos."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /comprobantes/{id}:
    get:
      tags:
        - "Comprobantes"
      summary: "Obtener detalle de comprobante por ID"
      operationId: "obtenerComprobantePorId"
      description: |
        **Caso de Uso**: `CU-05` (Consultar Estado Comprobante).
        
        Recupera el estado actual, datos completos, desglose de impuestos y constancia CDR del comprobante especificado por su UUID o identificador único.
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
          description: "Identificador único (UUID) del comprobante"
      responses:
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/NoAutorizado"
        "200":
          description: "Comprobante encontrado con estado y CDR asociado."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComprobanteResponse"
        "404":
          description: "El comprobante solicitado no existe."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /comprobantes/{id}/xml:
    get:
      tags:
        - "Artefactos"
      summary: "Descargar archivo XML UBL 2.1 firmado"
      operationId: "descargarXmlComprobante"
      description: |
        **Caso de Uso**: `CU-06` (Descargar Artefactos Electrónicos).
        
        Descarga el archivo XML oficial conforme al estándar OASIS UBL 2.1 con la firma digital estampada en el nodo `ext:UBLExtensions`.
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
          description: "UUID del comprobante"
      responses:
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/NoAutorizado"
        "200":
          description: "Archivo XML UBL 2.1 firmado descargado con éxito."
          content:
            application/xml:
              schema:
                type: "string"
                format: "binary"
        "404":
          description: "Comprobante o archivo XML no encontrado."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /comprobantes/{id}/pdf:
    get:
      tags:
        - "Artefactos"
      summary: "Descargar Representación Impresa (PDF)"
      operationId: "descargarPdfComprobante"
      description: |
        **Caso de Uso**: `CU-06` (Descargar Artefactos Electrónicos).
        
        Genera y descarga la representación impresa en formato PDF que incluye el código de barras bidimensional QR reglamentario de SUNAT y el valor resumen hash SHA-256.
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
          description: "UUID del comprobante"
      responses:
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/NoAutorizado"
        "200":
          description: "Documento PDF generado correctamente."
          content:
            application/pdf:
              schema:
                type: "string"
                format: "binary"
        "404":
          description: "Comprobante no encontrado."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /comprobantes/{id}/cdr:
    get:
      tags:
        - "Artefactos"
      summary: "Descargar Constancia de Recepción (CDR) de SUNAT/OSE"
      operationId: "descargarCdrComprobante"
      description: |
        **Caso de Uso**: `CU-06` (Descargar Artefactos Electrónicos).
        
        Descarga el archivo XML de la Constancia de Recepción (CDR) emitido y firmado por el OSE o SUNAT, certificando la validez tributaria.
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
          description: "UUID del comprobante"
      responses:
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/NoAutorizado"
        "200":
          description: "Constancia de Recepción XML obtenida."
          content:
            application/xml:
              schema:
                type: "string"
                format: "binary"
        "404":
          description: "El comprobante no posee CDR (aún en procesamiento o no existe)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /notas-credito:
    post:
      tags:
        - "Notas Modificatorias"
      summary: "Emitir Nota de Crédito Electrónica (07)"
      operationId: "emitirNotaCredito"
      description: |
        **Caso de Uso**: `CU-03` (Emitir Nota de Crédito).
        
        Emite una nota de crédito vinculada a una Factura o Boleta previa, aplicando causales de anulación, devolución o descuento según el Catálogo N° 09 de SUNAT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotaCreditoRequest"
            examples:
              devolucion_parcial:
                summary: "Nota de crédito por devolución de 2 sacos de arroz de la factura F001-42"
                value:
                  serie: "FC01"
                  fecha_emision: "2026-10-23"
                  moneda: "PEN"
                  documento_referenciado:
                    tipo_comprobante: "01"
                    serie: "F001"
                    correlativo: 42
                    fecha_emision: "2026-10-22"
                  motivo:
                    codigo: "07"
                    descripcion: "Devolución por ítem: 2 sacos con empaque dañado"
                  emisor:
                    ruc: "20601234565"
                    razon_social: "ABC SOFTWARE CORP S.A.C."
                    nombre_comercial: "DISTRIBUIDORA DE ABARROTES ABC"
                    direccion: "Av. Universitaria 123, Tingo María, Huánuco"
                    ubigeo: "100601"
                  receptor:
                    tipo_documento: "6"
                    numero_documento: "20555555556"
                    razon_social: "COMERCIALIZADORA SAN JUAN S.A.C."
                    direccion: "Jr. Comercio 456, Rupa Rupa, Leoncio Prado"
                    email: "facturacion@sanjuan.pe"
                  items:
                    - numero_linea: 1
                      codigo_producto: "PROD-ARR-01"
                      descripcion: "Arroz Extra Costeño Saco 50 kg"
                      unidad_medida: "SA"
                      cantidad: "2"
                      valor_unitario: "140.00"
                      tipo_afectacion_igv: "10"
      responses:
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/NoAutorizado"
        "201":
          description: "Nota de Crédito emitida y aceptada con CDR."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComprobanteResponse"
        "400":
          description: "Datos requeridos ausentes o motivo de nota inválido."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Serie y correlativo de la Nota de Crédito duplicado."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "Rechazo de validación fiscal por SUNAT/OSE, o el comprobante referenciado no existe / no está en estado ACEPTADO."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: "Error de comunicación con OSE o SUNAT."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /notas-debito:
    post:
      tags:
        - "Notas Modificatorias"
      summary: "Emitir Nota de Débito Electrónica (08)"
      operationId: "emitirNotaDebito"
      description: |
        **Caso de Uso**: `CU-04` (Emitir Nota de Débito).
        
        Emite una nota de débito para aumentar el valor de una Factura o Boleta previa por intereses, moras o gastos adicionales según el Catálogo N° 10 de SUNAT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotaDebitoRequest"
            examples:
              intereses_mora:
                summary: "Nota de débito por intereses de mora sobre la factura F001-42"
                value:
                  serie: "FD01"
                  fecha_emision: "2026-11-23"
                  moneda: "PEN"
                  documento_referenciado:
                    tipo_comprobante: "01"
                    serie: "F001"
                    correlativo: 42
                    fecha_emision: "2026-10-22"
                  motivo:
                    codigo: "01"
                    descripcion: "Intereses por mora de 30 días"
                  emisor:
                    ruc: "20601234565"
                    razon_social: "ABC SOFTWARE CORP S.A.C."
                    nombre_comercial: "DISTRIBUIDORA DE ABARROTES ABC"
                    direccion: "Av. Universitaria 123, Tingo María, Huánuco"
                    ubigeo: "100601"
                  receptor:
                    tipo_documento: "6"
                    numero_documento: "20555555556"
                    razon_social: "COMERCIALIZADORA SAN JUAN S.A.C."
                    direccion: "Jr. Comercio 456, Rupa Rupa, Leoncio Prado"
                    email: "facturacion@sanjuan.pe"
                  items:
                    - numero_linea: 1
                      codigo_producto: "INT-MORA"
                      descripcion: "Intereses por mora"
                      unidad_medida: "ZZ"
                      cantidad: "1"
                      valor_unitario: "50.00"
                      tipo_afectacion_igv: "10"
      responses:
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/NoAutorizado"
        "201":
          description: "Nota de Débito emitida y aceptada con CDR."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComprobanteResponse"
        "400":
          description: "Solicitud inválida o causal no reconocida."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Comprobante referenciado no encontrado."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Correlativo duplicado."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "Validación tributaria rechazada."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: "Fallo de conexión externa."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /comunicaciones-baja:
    post:
      tags:
        - "Comunicaciones y Resúmenes"
      summary: "Enviar Comunicación de Baja (Anulación de Comprobantes)"
      operationId: "enviarComunicacionBaja"
      description: |
        **Caso de Uso**: `CU-07` (Comunicar de Baja Comprobante).
        
        Genera el documento XML `UBL-VoidedDocuments-1.0` y lo remite a SUNAT para solicitar la baja de facturas o notas emitidas dentro del plazo reglamentario de 7 días calendario.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComunicacionBajaRequest"
            examples:
              baja_factura:
                summary: "Baja de la factura F001-42 por error en el RUC del cliente"
                value:
                  fecha_emision_documentos: "2026-10-22"
                  fecha_comunicacion: "2026-10-23"
                  documentos:
                    - tipo_comprobante: "01"
                      serie: "F001"
                      correlativo: 42
                      motivo_baja: "Error de digitación en RUC del cliente"
      responses:
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/NoAutorizado"
        "202":
          description: "Comunicación de baja recibida; SUNAT procesará de forma asíncrona. Consultar estado por el ticket devuelto."
