      operationId: "listarCuarentenaMigracion"
      description: |
        **Caso de Uso**: `CU-14` (Migrar Datos del Sistema Legado).

        Devuelve los registros rechazados por las validaciones del mapeo (`specs/features/0006-migracion-legado/design.md`) con su código de error estable, el valor original y su estado de reproceso. Los registros en cuarentena nunca se insertan de forma parcial en las tablas productivas.
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
          description: "UUID del lote de migración"
        - name: "estado"
          in: "query"
          required: false
          schema:
            $ref: "#/components/schemas/EstadoCuarentenaEnum"
        - name: "codigo_error"
          in: "query"
          required: false
          schema:
            $ref: "#/components/schemas/CodigoErrorCuarentenaEnum"
        - name: "pagina"
          in: "query"
          required: false
          schema:
            type: "integer"
            minimum: 1
            default: 1
        - name: "tamano"
          in: "query"
          required: false
          schema:
            type: "integer"
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/NoAutorizado"
        "200":
          description: "Página de registros en cuarentena del lote."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CuarentenaListaResponse"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "404":
          description: "Lote de migración no encontrado."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /migraciones/{id}/reprocesos:
    post:
      tags:
        - "Migración"
      summary: "Reprocesar registros en cuarentena de un lote con parches aprobados"
      operationId: "reprocesarCuarentenaMigracion"
      description: |
        **Caso de Uso**: `CU-14` (Migrar Datos del Sistema Legado).

        Aplica **parches de corrección aprobados** a registros en cuarentena `PENDIENTE` del lote `{id}` y crea un nuevo lote enlazado (`lote_origen_id = {id}`). Reglas:

        1. El parche se registra por separado; la extracción original **nunca** se modifica.
        2. Cada parche exige usuario aprobador, motivo y evidencia. No se admiten valores supuestos: si no hay evidencia, el registro permanece en cuarentena o se descarta con `accion = DESCARTAR` y autorización documentada.
        3. Los registros se validan de nuevo con la misma versión de reglas del lote o con una posterior (`version_reglas`).
        4. La carga es idempotente por `(sistema_origen, tipo_entidad, legado_id)`; repetir el mismo reproceso (misma `Idempotency-Key`) no duplica datos.
        5. Se repite la conciliación del lote y se registra la auditoría `legado_id → nuevo_id`.
        6. El reproceso **nunca** emite, firma ni envía comprobantes a OSE/SUNAT: los comprobantes migrados siguen siendo históricos (`es_historico = true`, `envio_sunat_habilitado = false`).
        7. Un registro con `COLISION_LEGADO_ID` no es reprocesable: detiene el lote y se investiga.
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
          description: "UUID del lote de migración de origen"
        - name: "Idempotency-Key"
          in: "header"
          required: true
          schema:
            type: "string"
            format: "uuid"
          description: "UUID generado por el cliente para este reproceso. Si el servidor ya lo procesó, devuelve el lote creado en la primera ejecución."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReprocesoCuarentenaRequest"
            examples:
              corregir_producto:
                summary: "Corrección de un código de producto con evidencia"
                value:
                  version_reglas: "1.0.0"
                  parches:
                    - legado_id: "legado:movimientos:1042"
                      accion: "CORREGIR"
                      campo: "producto"
                      valor_corregido: "A1"
                      motivo: "El código estaba truncado en la exportación del sistema antiguo."
                      evidencia: "Maestro de productos del almacén, hoja 3, fila 17"
                      aprobado_por: "contador@abcsoftwarecorp.pe"
      responses:
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/NoAutorizado"
        "202":
          description: "Reproceso aceptado. Se creó un nuevo lote enlazado al lote de origen."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigracionResponse"
        "400":
          description: "Solicitud malformada (parches vacíos, campos obligatorios ausentes o `Idempotency-Key` inválida)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Lote de migración no encontrado."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "El lote de origen sigue en ejecución o ya existe un reproceso activo sobre él."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "Parche rechazado: sin evidencia, registro que no está en cuarentena `PENDIENTE`, `legado_id` inexistente en el lote o registro con `COLISION_LEGADO_ID`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /libros/registro-ventas:
    get:
      tags:
        - "Libros Electrónicos"
      summary: "Generar Registro de Ventas e Ingresos (PLE 14.1)"
      operationId: "generarRegistroVentas"
      description: |
        **Caso de Uso**: `CU-15` (Generar Registro de Ventas).

        Genera el archivo del Registro de Ventas del periodo a partir de los comprobantes `ACEPTADO` y `DE_BAJA`. ⚠️ Por verificar: formato PLE 14.1 o SIRE/RVIE según la normativa vigente.
      parameters:
        - name: "periodo"
          in: "query"
          required: true
          schema:
            type: "string"
            pattern: "^[0-9]{4}(0[1-9]|1[0-2])$"
          description: "Periodo tributario en formato AAAAMM."
          example: "202610"
      responses:
        "200":
          description: "Archivo TXT del Registro de Ventas."
          content:
            text/plain:
              schema:
                type: "string"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/NoAutorizado"
        "404":
          description: "No hay comprobantes en el periodo indicado."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /libros/inventario-permanente:
    get:
      tags:
        - "Libros Electrónicos"
      summary: "Generar Registro de Inventario Permanente en Unidades Físicas (PLE 12.1)"
      operationId: "generarInventarioPermanente"
      description: |
        **Caso de Uso**: `CU-16` (Generar Registro de Inventario Permanente).

        Genera el archivo del Kardex del periodo desde los movimientos de almacén: entradas, salidas y saldo en unidades físicas por producto y establecimiento.
      parameters:
        - name: "periodo"
          in: "query"
          required: true
          schema:
            type: "string"
            pattern: "^[0-9]{4}(0[1-9]|1[0-2])$"
          description: "Periodo en formato AAAAMM."
          example: "202610"
        - name: "codigo_establecimiento"
          in: "query"
          required: false
          schema:
            type: "string"
            maxLength: 4
          description: "Código del establecimiento anexo (⚠️ Por verificar formato)."
      responses:
        "200":
          description: "Archivo TXT del Registro de Inventario Permanente."
          content:
            text/plain:
              schema:
                type: "string"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/NoAutorizado"
        "404":
          description: "No hay movimientos en el periodo indicado."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  responses:
    NoAutenticado:
      description: "No autenticado. Token JWT ausente, inválido o expirado."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NoAutorizado:
      description: "No autorizado. El usuario autenticado no tiene permiso para la operación."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    SolicitudInvalida:
      description: "Parámetros de consulta inválidos."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    EmitirComprobanteRequest:
      type: "object"
      required:
        - "tipo_comprobante"
        - "serie"
        - "fecha_emision"
        - "moneda"
        - "emisor"
        - "receptor"
        - "items"
      properties:
        tipo_comprobante:
          $ref: "#/components/schemas/TipoComprobanteEnum"
        serie:
          type: "string"
          pattern: "^[FB][A-Z0-9]{3}$"
          description: "Serie del comprobante: F seguido de 3 alfanuméricos para Factura; B seguido de 3 alfanuméricos para Boleta. El correlativo es asignado atómicamente por el servidor."
          example: "F001"
        tipo_operacion:
          type: "string"
          pattern: "^[0-9]{4}$"
          default: "0101"
          description: "Catálogo N° 51 SUNAT, tipo de operación (cbc:ProfileID). '0101' venta interna. ⚠️ Por verificar lista vigente [F-02]."
          example: "0101"
        fecha_emision:
          type: "string"
          format: "date"
          example: "2026-10-22"
        hora_emision:
          type: "string"
          pattern: "^(0[0-9]|1[0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$"
          example: "10:30:00"
        moneda:
          type: "string"
          enum: ["PEN", "USD"]
          default: "PEN"
        forma_pago:
          $ref: "#/components/schemas/FormaPago"
        emisor:
          $ref: "#/components/schemas/EmisorFiscal"
        receptor:
          $ref: "#/components/schemas/ClienteReceptorDto"
        items:
          type: "array"
          minItems: 1
          items:
            $ref: "#/components/schemas/ItemComprobanteDto"

    ComprobanteResponse:
      type: "object"
      required:
        - "id"
        - "tipo_comprobante"
        - "serie"
        - "correlativo"
        - "fecha_emision"
        - "moneda"
        - "importe_total"
        - "estado"
        - "hash_sha256"
        - "fecha_registro"
      properties:
        id:
          type: "string"
          format: "uuid"
          example: "a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11"
        tipo_comprobante:
          $ref: "#/components/schemas/TipoComprobanteEnum"
        serie:
          type: "string"
          example: "F001"
        correlativo:
          type: "integer"
          example: 42
        fecha_emision:
          type: "string"
          format: "date"
          example: "2026-10-22"
        moneda:
          type: "string"
          example: "PEN"
        importe_total:
          type: "string"
          pattern: "^[0-9]+(\\.[0-9]{1,10})?$"
          description: "Importe total a pagar (cac:LegalMonetaryTotal/cbc:PayableAmount). Decimal exacto como texto."
          example: "2130.18"
        estado:
          $ref: "#/components/schemas/EstadoComprobanteEnum"
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/ItemCalculadoDto"
        totales:
          $ref: "#/components/schemas/TotalesComprobanteDto"
        hash_sha256:
          type: "string"
          example: "4v8K+qK20yD...SHA256HASH=="
          description: "Digest criptográfico de la firma digital XMLDSig"
        cdr:
          $ref: "#/components/schemas/CdrDto"
        enlaces:
          type: "object"
          properties:
            xml:
              type: "string"
              example: "/v1/comprobantes/a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11/xml"
            pdf:
              type: "string"
              example: "/v1/comprobantes/a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11/pdf"
            cdr:
              type: "string"
              example: "/v1/comprobantes/a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11/cdr"
        fecha_registro:
          type: "string"
          format: "date-time"
          example: "2026-10-22T10:30:15Z"

    ComprobanteListResponse:
      type: "object"
      required:
        - "data"
        - "page"
        - "page_size"
        - "total_records"
        - "total_pages"
      properties:
        data:
          type: "array"
          items:
            $ref: "#/components/schemas/ComprobanteResponse"
        page:
          type: "integer"
          example: 1
        page_size:
          type: "integer"
          example: 20
        total_records:
          type: "integer"
          example: 142
        total_pages:
          type: "integer"
          example: 8

    EmisorFiscal:
      type: "object"
      required:
        - "ruc"
        - "razon_social"
        - "direccion"
        - "ubigeo"
      properties:
        ruc:
          type: "string"
          pattern: "^[0-9]{11}$"
          example: "20601234565"
        razon_social:
          type: "string"
          example: "ABC SOFTWARE CORP S.A.C."
        nombre_comercial:
          type: "string"
          example: "DISTRIBUIDORA DE ABARROTES ABC"
        direccion:
          type: "string"
          example: "Av. Universitaria 123, Tingo María, Huánuco"
        ubigeo:
          type: "string"
          pattern: "^[0-9]{6}$"
          example: "100601"

    ClienteReceptorDto:
      type: "object"
      required:
        - "tipo_documento"
        - "numero_documento"
        - "razon_social"
      properties:
        tipo_documento:
          type: "string"
          enum: ["6", "1", "4", "7", "0"]
          description: "Catálogo 06 SUNAT: '6' RUC, '1' DNI, '4' Carné Extranjería, '0' Sin Documento"
          example: "6"
        numero_documento:
          type: "string"
          example: "20555555556"
        razon_social:
          type: "string"
          example: "COMERCIALIZADORA SAN JUAN S.A.C."
        direccion:
          type: "string"
          example: "Jr. Comercio 456, Rupa Rupa, Leoncio Prado"
        email:
          type: "string"
          format: "email"
          example: "facturacion@sanjuan.pe"

    ItemComprobanteDto:
      type: "object"
      description: |
        Línea de detalle **enviada por el cliente**. Solo contiene datos comerciales. El servidor calcula
        precio con impuestos, valor de venta, ISC, IGV e ICBPER; el cliente no envía ningún monto de impuesto.
      required:
        - "numero_linea"
        - "codigo_producto"
        - "descripcion"
        - "unidad_medida"
        - "cantidad"
        - "valor_unitario"
        - "tipo_afectacion_igv"
      properties:
        numero_linea:
          type: "integer"
          minimum: 1
          example: 1
        codigo_producto:
          type: "string"
          example: "PROD-ARR-01"
        descripcion:
          type: "string"
          maxLength: 250
          example: "Arroz Extra Costeño Saco 50 kg"
        unidad_medida:
          $ref: "#/components/schemas/UnidadMedidaEnum"
        cantidad:
          type: "string"
          pattern: "^(?!0+(\\.0+)?$)[0-9]+(\\.[0-9]{1,10})?$"
          description: "Cantidad comercial (cbc:InvoicedQuantity). Mayor que cero; decimal exacto como texto."
          example: "10"
        valor_unitario:
          type: "string"
          pattern: "^[0-9]+(\\.[0-9]{1,10})?$"
          description: "Valor unitario sin impuestos (cac:Price/cbc:PriceAmount). Decimal exacto como texto."
          example: "140.00"
        tipo_afectacion_igv:
          $ref: "#/components/schemas/TipoAfectacionIgvEnum"
        sistema_isc:
          $ref: "#/components/schemas/SistemaIscEnum"
        tasa_isc:
          type: "string"
          pattern: "^[0-9]{1,3}\\.[0-9]{2}$"
          description: "Tasa porcentual del ISC (sistemas 01 y 03) según la norma vigente a la fecha de emisión. Decimal exacto como texto."
          example: "17.00"
        monto_fijo_isc:
          type: "string"
          pattern: "^[0-9]+(\\.[0-9]{1,10})?$"
          description: "Monto fijo de ISC por unidad física (sistema 02, cbc:PerUnitAmount)."
          example: "1.25"
        unidad_base_isc:
          $ref: "#/components/schemas/UnidadMedidaEnum"
        precio_venta_publico_sugerido:
          type: "string"
          pattern: "^[0-9]+(\\.[0-9]{1,10})?$"
          description: "PVP sugerido del fabricante para ISC sistema 03. ⚠️ Por verificar: elemento UBL exacto en el perfil SUNAT."
          example: "5.00"
        cantidad_bolsas:
          type: "integer"
          minimum: 1
          description: "Número de bolsas plásticas sujetas a ICBPER (cbc:BaseUnitMeasure en TaxSubtotal ID=7152). Distinto de la cantidad comercial del ítem. El importe por bolsa lo resuelve el servidor por fecha de emisión."
          example: 10
      allOf:
        - if:
            required: ["sistema_isc"]
            properties:
              sistema_isc:
                const: "01"
          then:
            required: ["tasa_isc"]
            properties:
              tasa_isc:
                type: "string"
        - if:
            required: ["sistema_isc"]
            properties:
              sistema_isc:
                const: "02"
          then:
            required: ["monto_fijo_isc", "unidad_base_isc"]
            properties:
              monto_fijo_isc:
                type: "string"
              unidad_base_isc:
                $ref: "#/components/schemas/UnidadMedidaEnum"
        - if:
            required: ["sistema_isc"]
            properties:
              sistema_isc:
                const: "03"
          then:
            required: ["tasa_isc", "precio_venta_publico_sugerido"]
            properties:
              tasa_isc:
                type: "string"
              precio_venta_publico_sugerido:
                type: "string"

    ItemCalculadoDto:
      type: "object"
      description: "Línea de detalle **calculada por el servidor** y devuelta en la respuesta. Decimales exactos como texto."
      required:
        - "numero_linea"
        - "codigo_producto"
        - "descripcion"
        - "unidad_medida"
        - "cantidad"
        - "valor_unitario"
        - "precio_unitario"
        - "tipo_afectacion_igv"
        - "valor_total"
        - "monto_igv"
      properties:
        numero_linea:
          type: "integer"
          example: 1
        codigo_producto:
          type: "string"
          example: "PROD-ARR-01"
        descripcion:
          type: "string"
          example: "Arroz Extra Costeño Saco 50 kg"
        unidad_medida:
          $ref: "#/components/schemas/UnidadMedidaEnum"
        cantidad:
          type: "string"
          example: "10"
        valor_unitario:
          type: "string"
          example: "140.00"
        precio_unitario:
          type: "string"
          description: "Precio unitario con IGV/ISC, sin ICBPER (PricingReference, PriceTypeCode 01)."
          example: "165.20"
        tipo_afectacion_igv:
          $ref: "#/components/schemas/TipoAfectacionIgvEnum"
        valor_total:
          type: "string"
          description: "Valor de venta de la línea sin impuestos (cbc:LineExtensionAmount)."
          example: "1400.00"
        monto_isc:
          type: "string"
          example: "0.00"
        monto_igv:
          type: "string"
          example: "252.00"
        monto_icbper:
          type: "string"
          example: "0.00"

    UnidadMedidaEnum:
      type: "string"
      description: |
        Catálogo N° 03 SUNAT (UN/ECE Rec. 20). Subconjunto habilitado para abarrotes; texto libre como
        "UNID" o "SACO" se rechaza. ⚠️ Por verificar: ampliar con la lista vigente del Anexo 8 [F-02].
      enum: ["NIU", "ZZ", "KGM", "GRM", "TNE", "LTR", "MLT", "GLL", "MTR", "BX", "BG", "SA", "PK", "DZN", "CS"]
      example: "NIU"

    TipoAfectacionIgvEnum:
      type: "string"
      description: "Catálogo N° 07 SUNAT, tipo de afectación al IGV (ej. '10' Gravado oneroso, '20' Exonerado oneroso, '30' Inafecto oneroso, '40' Exportación)."
      enum: ["10", "11", "12", "13", "14", "15", "16", "17", "20", "21", "30", "31", "32", "33", "34", "35", "36", "37", "40"]
      example: "10"

    SistemaIscEnum:
      type: "string"
      description: "Catálogo N° 08 SUNAT, sistema de cálculo del ISC: '01' Al valor, '02' Específico, '03' Al valor según precio de venta al público. Requerido si el ítem está afecto a ISC."
      enum: ["01", "02", "03"]
      example: "01"

    TotalesComprobanteDto:
      type: "object"
      description: "Totales **calculados por el servidor** y devueltos en la respuesta. El cliente NO envía totales ni montos de impuestos."
      required:
        - "total_operaciones_gravadas"
        - "total_igv"
        - "total_impuestos"
        - "importe_total"
      properties:
        total_valor_venta:
          type: "string"
          pattern: "^[0-9]+(\\.[0-9]{1,10})?$"
          description: "Suma de los valores de venta de las líneas antes de tributos (cac:LegalMonetaryTotal/cbc:LineExtensionAmount)."
          example: "1801.00"
        total_operaciones_gravadas:
          type: "string"
          pattern: "^[0-9]+(\\.[0-9]{1,10})?$"
          description: "Suma de valores de venta de líneas afectas al IGV (cbc:LineExtensionAmount gravados). Decimal exacto como texto."
          example: "1801.00"
        total_operaciones_inafectas:
          type: "string"
          pattern: "^[0-9]+(\\.[0-9]{1,10})?$"
          default: "0.00"
          description: "Suma de valores de venta de líneas inafectas (Cat. 07 cod. 30-36). Decimal exacto como texto."
          example: "0.00"
        total_operaciones_exoneradas:
          type: "string"
          pattern: "^[0-9]+(\\.[0-9]{1,10})?$"
          default: "0.00"
          description: "Suma de valores de venta de líneas exoneradas (Cat. 07 cod. 20-21). Decimal exacto como texto."
          example: "0.00"
        total_igv:
          type: "string"
          pattern: "^[0-9]+(\\.[0-9]{1,10})?$"
          description: "Total IGV del comprobante (cac:TaxTotal/.../ID='1000'). Calculado por el dominio."
          example: "324.18"
        total_isc:
          type: "string"
          pattern: "^[0-9]+(\\.[0-9]{1,10})?$"
          default: "0.00"
          description: "Total ISC del comprobante (cac:TaxTotal/.../ID='2000'). Calculado por el dominio."
          example: "0.00"
        total_icbper:
          type: "string"
          pattern: "^[0-9]+(\\.[0-9]{1,10})?$"
          default: "0.00"
          description: "Total ICBPER del comprobante (cac:TaxTotal/.../ID='7152'). Calculado por el dominio."
          example: "5.00"
        total_impuestos:
          type: "string"
          pattern: "^[0-9]+(\\.[0-9]{1,10})?$"
          description: "Suma total de tributos: IGV + ISC + ICBPER (cac:TaxTotal/cbc:TaxAmount). Calculado por el dominio."
          example: "329.18"
        total_precio_venta:
          type: "string"
          pattern: "^[0-9]+(\\.[0-9]{1,10})?$"
          description: "Valor de venta + tributos (cac:LegalMonetaryTotal/cbc:TaxInclusiveAmount)."
          example: "2130.18"
        total_descuentos:
          type: "string"
          pattern: "^[0-9]+(\\.[0-9]{1,10})?$"
          default: "0.00"
          description: "Descuentos globales (cbc:AllowanceTotalAmount). Catálogo 53 para el motivo."
          example: "0.00"
        total_cargos:
          type: "string"
          pattern: "^[0-9]+(\\.[0-9]{1,10})?$"
          default: "0.00"
          description: "Cargos globales (cbc:ChargeTotalAmount)."
          example: "0.00"
        importe_total:
          type: "string"
          pattern: "^[0-9]+(\\.[0-9]{1,10})?$"
          description: "Importe total a pagar: valor de venta + tributos (cac:LegalMonetaryTotal/cbc:PayableAmount). Calculado por el dominio."
          example: "2130.18"

    FormaPago:
      type: "object"
